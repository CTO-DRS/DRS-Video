name: drs_video
description: "DRS Video - Advanced video player and library platform."
publish_to: "none"
version: 1.0.4+5

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any

  # State management
  provider: ^6.1.2

  # Advanced video playback (libmpv based): tracks, subtitles, speed
  media_kit: ^1.1.11
  media_kit_video: ^1.2.5
  media_kit_libs_android_video: ^1.3.7

  # Networking
  dio: ^5.7.0
  connectivity_plus: ^6.1.1

  # Real background download engine (WorkManager based)
  flutter_downloader: ^1.12.1

  # Storage
  sqflite: ^2.4.1
  path: ^1.9.0
  path_provider: ^2.1.5
  shared_preferences: ^2.3.4

  # System integration
  file_picker: ^10.3.0
  flutter_local_notifications: ^17.2.4
  permission_handler: ^11.3.1
  device_info_plus: ^10.1.2
  package_info_plus: ^8.1.1
  share_plus: ^10.1.2
  open_filex: ^4.5.0
  dynamic_color: ^1.7.0
  crypto: ^3.0.6
  audio_service: ^0.18.18
  collection: ^1.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.1
  sqflite_common_ffi: ^2.3.3

flutter:
  uses-material-design: true
  generate: true

flutter_launcher_icons:
  android: "launcher_icon"
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#0E1120"
  adaptive_icon_foreground: "assets/icon/icon_fg.png"
  min_sdk_android: 24
